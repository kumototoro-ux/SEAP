<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة مِرقاة التعليمية - الموظفين</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card" id="loginCard">
  <h2>منصة مِرقاة التعليمية</h2>
  <div class="field"><label>اسم المستخدم</label><input id="username" type="text"></div>
  <div class="field"><label>كلمة المرور</label><input id="password" type="password"></div>
  <button id="loginBtn">دخول</button>
  <p class="error-msg" id="loginError"></p>
</div>

<div class="card dashboard" id="firstLoginCard">
  <h2>تعيين كلمة مرور جديدة</h2>
  <p>هذا أول دخول لك، يجب تعيين كلمة مرور جديدة قبل المتابعة</p>
  <div class="field"><label>كلمة المرور الجديدة</label><input id="newPassword" type="password"></div>
  <button id="setPasswordBtn">تعيين وحفظ</button>
  <p class="error-msg" id="setPasswordError"></p>
</div>

<div class="card dashboard" id="dashboardCard">
  <h2 id="welcomeName"></h2>
  <p id="welcomeRole"></p>
  <button class="logout-btn" id="logoutBtn">تسجيل الخروج</button>
</div>

<script src="app.js"></script>

</body>
</html>
